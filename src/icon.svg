<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Family tile: 22.44% radius, accent fill, white filled glyph — the abacus/bird convention.
       #E1141D is Exact Online's own brand red, so the plugin reads as the Exact plugin the way
       Shipper reads as ShipStation and Bird as Moneybird. -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#E1141D"/>
  <!-- A double rule: the mark an accountant draws under a total that has been checked, which is
       also an equals sign, which is also the plugin's name and the thing it actually does — prove
       that what Exact will invoice equals what the customer paid.

       Deliberately not another white invoice sheet: Sevvies, My, Twinsies and Freshh all already
       have one, and at 16px they are indistinguishable from each other. Two bars are not. -->
  <g fill="#FEFEFE">
    <rect x="20" y="31" width="60" height="13" rx="3.5"/>
    <rect x="20" y="56" width="60" height="13" rx="3.5"/>
  </g>
</svg>
